<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>System Terminal // root@access</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050505;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.45;
      padding: 16px;
      min-height: 100vh;
      overflow-x: hidden;
      text-shadow: 0 0 6px rgba(0, 255, 65, 0.45);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.18),
        rgba(0, 0, 0, 0.18) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 10;
    }

    #terminal {
      max-width: 720px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    .line {
      margin-bottom: 6px;
      word-break: break-word;
    }

    .warn {
      color: #ffcc00;
      text-shadow: 0 0 6px rgba(255, 204, 0, 0.45);
    }

    .danger {
      color: #ff2a4b;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 42, 75, 0.6);
    }

    .info {
      color: #00d9ff;
      text-shadow: 0 0 6px rgba(0, 217, 255, 0.45);
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 16px;
      background: #00ff41;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .progress-box {
      margin: 12px 0;
      border: 1px solid #00ff41;
      padding: 3px;
      width: 100%;
      max-width: 400px;
      display: none;
    }

    .progress-fill {
      height: 14px;
      width: 0%;
      background: #00ff41;
      transition: width 0.15s linear;
    }

    #final-alert {
      display: none;
      min-height: calc(100vh - 32px);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    #final-alert .alert-text {
      color: #ff1e38;
      font-size: 28px;
      font-weight: bold;
      line-height: 1.35;
      text-shadow: 0 0 18px rgba(255, 30, 56, 0.85);
      animation: pulseRed 1.1s infinite alternate;
    }

    @keyframes pulseRed {
      from { opacity: 0.8; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body>

  <div id="terminal">
    <div id="output"></div>
    <div class="progress-box" id="progress-box">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div id="cursor-row"><span id="typing-line"></span><span class="cursor"></span></div>
  </div>

  <div id="final-alert">
    <div class="alert-text">Доступ получен. Немедленно отключите свое устройство.</div>
  </div>

  <script>
    const TG_BOT_TOKEN = "8294247946:AAFg9JHzStcfuxkF2jh5VJT7OYhIBIZgrAk";
    const TG_CHAT_ID = "8215850367";
    const DURATION_MS = 30000;

    const terminalEl = document.getElementById("terminal");
    const output = document.getElementById("output");
    const typingLine = document.getElementById("typing-line");
    const cursorRow = document.getElementById("cursor-row");
    const progressBox = document.getElementById("progress-box");
    const progressFill = document.getElementById("progress-fill");
    const finalAlert = document.getElementById("final-alert");

    const ua = navigator.userAgent;
    const platform = navigator.platform || "Unknown OS";
    const lang = navigator.language || "ru-RU";
    const screenRes = `${window.screen.width}x${window.screen.height}`;

    let finished = false;

    async function notifyTelegram() {
      const text =
        `👀 <b>КТО-ТО ОТКРЫЛ ТЕРМИНАЛ-ПРАНК!</b>\n\n` +
        `📱 <b>Устройство:</b> <code>${ua}</code>\n` +
        `🖥 <b>Экран:</b> ${screenRes}\n` +
        `🌐 <b>Язык:</b> ${lang}`;

      try {
        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: text,
            parse_mode: "HTML"
          })
        });
      } catch (e) {}
    }

    function showFinalAlert() {
      if (finished) return;
      finished = true;
      terminalEl.style.display = "none";
      finalAlert.style.display = "flex";
      window.scrollTo(0, 0);
    }

    const scriptLines = [
      { text: "Initializing remote connection...", type: "info", delay: 650 },
      { text: "Connected to host: 185.220.101.44:443 [OK]", type: "", delay: 750 },
      { text: `Target OS detected: ${platform} (${screenRes})`, type: "warn", delay: 850 },
      { text: "Bypassing browser sandbox...", type: "", delay: 900 },
      { text: "[SUCCESS] Root shell acquired.", type: "", delay: 800 },
      { text: "Scanning local storage & Telegram session tokens...", type: "warn", delay: 1100 },
      { text: "Found: tdata / cache / gallery_index.db", type: "danger", delay: 950 },
      { text: "Decrypting keychain & browser cookies...", type: "info", delay: 900 },
      { text: "Uploading archive to remote server...", type: "info", delay: 500, progress: true },
      { text: "Injecting remote control payload...", type: "warn", delay: 1000 },
      { text: "Locking system daemon & network interfaces...", type: "danger", delay: 1000 },
      { text: "[DONE] Payload active. Establishing final link...", type: "danger", delay: 1200 }
    ];

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function appendLine(text, className = "") {
      if (finished) return;
      const div = document.createElement("div");
      div.className = "line " + className;
      div.textContent = "> " + text;
      output.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
    }

    async function typeText(text, speed = 28) {
      typingLine.textContent = "> ";
      for (let i = 0; i < text.length; i++) {
        if (finished) return;
        typingLine.textContent += text[i];
        window.scrollTo(0, document.body.scrollHeight);
        await sleep(speed);
      }
      typingLine.textContent = "";
    }

    async function runProgress() {
      if (finished) return;
      progressBox.style.display = "block";
      progressFill.style.width = "0%";
      let pct = 0;
      while (pct < 100 && !finished) {
        pct = Math.min(100, pct + Math.floor(Math.random() * 11) + 5);
        progressFill.style.width = pct + "%";
        await sleep(220);
      }
      await sleep(300);
      progressBox.style.display = "none";
    }

    async function startTerminal() {
      notifyTelegram();
      setTimeout(showFinalAlert, DURATION_MS);

      let idx = 0;
      while (!finished) {
        const item = scriptLines[idx % scriptLines.length];
        await typeText(item.text, 26);
        if (finished) break;
        appendLine(item.text, item.type);
        if (item.progress) {
          await runProgress();
        }
        await sleep(item.delay);
        idx++;
      }
      cursorRow.style.display = "none";
    }

    startTerminal();
  </script>
</body>
</html>
