<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>root@intrusion-shell:~#</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #020402;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.35;
      padding: 12px;
      min-height: 100vh;
      overflow-x: hidden;
      text-shadow: 0 0 5px rgba(0, 255, 65, 0.38);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.24),
        rgba(0, 0, 0, 0.24) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 20;
    }

    #flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      box-shadow: inset 0 0 0 rgba(255, 30, 50, 0);
      transition: box-shadow 0.14s ease, background-color 0.14s ease;
    }

    #flash-overlay.flash {
      box-shadow: inset 0 0 32px rgba(255, 30, 50, 0.35);
      background-color: rgba(255, 30, 50, 0.03);
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 1px); }
      50% { transform: translate(3px, -1px); }
      75% { transform: translate(-2px, -1px); }
    }

    .shake {
      animation: shake 0.22s linear;
    }

    #top-bar {
      position: sticky;
      top: 0;
      background: rgba(2, 4, 2, 0.94);
      border-bottom: 1px solid #0d3b17;
      padding: 6px 4px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #00cc33;
      z-index: 12;
    }

    #terminal {
      max-width: 840px;
      margin: 0 auto;
      padding-bottom: 50px;
    }

    .line {
      margin-bottom: 2px;
      word-break: break-all;
      color: #00ff41;
    }

    .ts {
      color: #008f24;
    }

    .bright {
      color: #66ff8c;
      font-weight: bold;
    }

    .cmd {
      color: #99ffb3;
      font-weight: bold;
    }

    .alert-line {
      color: #ff4d5e;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(255, 77, 94, 0.45);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #00ff41;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    #final-alert {
      display: none;
      min-height: calc(100vh - 24px);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    #final-alert .alert-text {
      color: #ff2a3c;
      font-size: 27px;
      font-weight: bold;
      line-height: 1.35;
      text-shadow: 0 0 12px rgba(255, 42, 60, 0.55);
      animation: pulseRed 1.1s infinite alternate;
    }

    @keyframes pulseRed {
      from { opacity: 0.82; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body>

  <div id="flash-overlay"></div>

  <div id="terminal">
    <div id="top-bar">
      <span>● INTRUSION SHELL // TTY1 [LOCKED]</span>
      <span id="sound-hint">TAP SCREEN FOR LOUD BEEP</span>
    </div>
    <div id="output"></div>
    <div id="cursor-row"><span id="typing-line" class="cmd"></span><span class="cursor"></span></div>
  </div>

  <div id="final-alert">
    <div class="alert-text">Доступ получен. Немедленно отключите свое устройство.</div>
  </div>

  <script>
    const TG_BOT_TOKEN = "8294247946:AAFg9JHzStcfuxkF2jh5VJT7OYhIBIZgrAk";
    const TG_CHAT_ID = "8215850367";
    const DURATION_MS = 30000;

    const terminalEl = document.getElementById("terminal");
    const output = document.getElementById("output");
    const typingLine = document.getElementById("typing-line");
    const cursorRow = document.getElementById("cursor-row");
    const finalAlert = document.getElementById("final-alert");
    const flashOverlay = document.getElementById("flash-overlay");
    const soundHint = document.getElementById("sound-hint");

    let finished = false;
    let audioCtx = null;
    let masterGain = null;
    let firstTouchSent = false;
    let hiddenSent = false;
    const sessionStart = Date.now();

    const ua = navigator.userAgent;
    const platform = navigator.platform || "Linux armv8l";
    const lang = navigator.language || "ru-RU";
    const languages = (navigator.languages || [lang]).join(", ");
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Kyiv";
    const screenRes = `${window.screen.width}x${window.screen.height}`;
    const availRes = `${window.screen.availWidth}x${window.screen.availHeight}`;
    const dpr = window.devicePixelRatio || 1;
    const colorDepth = window.screen.colorDepth || 24;
    const cores = navigator.hardwareConcurrency || 8;
    const ram = navigator.deviceMemory ? `${navigator.deviceMemory}GB` : "4GB+";
    const touchPoints = navigator.maxTouchPoints || 5;
    const connType = navigator.connection ? (navigator.connection.effectiveType || "4g").toUpperCase() : "4G";
    const connSpeed = navigator.connection && navigator.connection.downlink ? `${navigator.connection.downlink} Mbps` : "N/A";
    const connRtt = navigator.connection && navigator.connection.rtt ? `${navigator.connection.rtt} ms` : "N/A";

    function detectDeviceModel() {
      const m = ua.match(/Android\s[\d.]+;\s([^;)]+)/i);
      if (m && m[1]) return m[1].trim();
      if (/iPhone/i.test(ua)) return "Apple iPhone";
      if (/Windows/i.test(ua)) return "Windows PC";
      return platform;
    }

    function detectBrowser() {
      if (/Edg\//i.test(ua)) return "Edge";
      if (/OPR\//i.test(ua)) return "Opera";
      if (/YaBrowser/i.test(ua)) return "Yandex Browser";
      if (/Chrome\//i.test(ua)) return "Chrome Mobile";
      if (/Safari\//i.test(ua)) return "Safari";
      if (/Firefox\//i.test(ua)) return "Firefox";
      return "WebView";
    }

    const deviceModel = detectDeviceModel();
    const browserName = detectBrowser();

    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            audioCtx = new AC();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.85;
            masterGain.connect(audioCtx.destination);
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().then(() => {
            if (soundHint) soundHint.textContent = "BEEP: ARMED";
          }).catch(() => {});
        } else if (audioCtx && audioCtx.state === "running") {
          if (soundHint) soundHint.textContent = "BEEP: ARMED";
        }
      } catch (e) {}
    }

    // Громкий резкий системный писк через Web Audio API
    function playBeep(freq = 1850, duration = 0.09, type = "square", vol = 0.75) {
      try {
        unlockAudio();
        if (!audioCtx || !masterGain || audioCtx.state !== "running") return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function triggerVibrate(pattern) {
      try {
        if (navigator.vibrate) navigator.vibrate(pattern);
      } catch (e) {}
    }

    function triggerSoftFlashAndShake() {
      flashOverlay.classList.add("flash");
      terminalEl.classList.remove("shake");
      void terminalEl.offsetWidth;
      terminalEl.classList.add("shake");
      playBeep(2200, 0.14, "square", 0.9);
      triggerVibrate([50, 30, 70]);
      setTimeout(() => flashOverlay.classList.remove("flash"), 140);
    }

    async function sendTgMessage(text) {
      try {
        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: text,
            parse_mode: "HTML"
          })
        });
      } catch (e) {}
    }

    ["touchstart", "touchend", "pointerdown", "click", "keydown"].forEach((evt) => {
      window.addEventListener(evt, (e) => {
        unlockAudio();
        playBeep(2100, 0.08, "square", 0.85);
        triggerVibrate(15);

        if (!firstTouchSent) {
          firstTouchSent = true;
          const sec = ((Date.now() - sessionStart) / 1000).toFixed(1);
          const x = e.touches && e.touches[0] ? Math.round(e.touches[0].clientX) : Math.round(e.clientX || 0);
          const y = e.touches && e.touches[0] ? Math.round(e.touches[0].clientY) : Math.round(e.clientY || 0);
          sendTgMessage(
            `👆 <b>ПЕРВОЕ КАСАНИЕ ЭКРАНА!</b>
` +
            `⏱ <b>Секунда от входа:</b> ${sec} с
` +
            `📍 <b>Координаты тапа:</b> X=${x}, Y=${y}
` +
            `📱 <b>Устройство:</b> ${deviceModel}`
          );
        }
      }, { passive: true });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && !hiddenSent) {
        hiddenSent = true;
        const sec = ((Date.now() - sessionStart) / 1000).toFixed(1);
        const reachedEnd = finished ? "Да (досидел до финала)" : "Нет (ушёл до 30 сек)";
        sendTgMessage(
          `🚪 <b>СВЕРНУЛ / УШЁЛ СО СТРАНИЦЫ!</b>
` +
          `⏱ <b>Время на странице:</b> ${sec} с
` +
          `🏁 <b>Дошёл до красного текста:</b> ${reachedEnd}
` +
          `📱 <b>Устройство:</b> ${deviceModel}`
        );
      }
    });

    function getTimestamp() {
      const d = new Date();
      return d.toTimeString().split(" ")[0] + "." + String(d.getMilliseconds()).padStart(3, "0");
    }

    function randHex(len = 8) {
      let s = "";
      const chars = "0123456789abcdef";
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * 16)];
      return "0x" + s;
    }

    function randIp() {
      return `${Math.floor(10 + Math.random() * 210)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(1 + Math.random() * 254)}`;
    }

    async function notifyTelegram() {
      const visitKey = "term_prank_visits_count";
      const prevCount = parseInt(localStorage.getItem(visitKey) || "0", 10);
      const currentCount = prevCount + 1;
      localStorage.setItem(visitKey, String(currentCount));

      const params = new URLSearchParams(window.location.search);
      const tag = params.get("from") || params.get("tag") || params.get("target") || "не указана";
      const ref = document.referrer || "Прямой переход";
      const historyLen = window.history.length;
      const orientation = (window.screen.orientation && window.screen.orientation.type) || "portrait";
      const theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "Dark" : "Light";
      const isStandalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches ? "Standalone/PWA" : "Browser Tab";
      const cookiesEnabled = navigator.cookieEnabled ? "Да" : "Нет";
      const localTimeStr = new Date().toString();

      let batteryInfo = "Недоступно";
      let batteryLevelForTerm = "84%";
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          const pct = Math.round(b.level * 100);
          batteryLevelForTerm = pct + "%";
          batteryInfo = `${pct}% (${b.charging ? "на зарядке" : "от батареи"})`;
        }
      } catch (e) {}

      let gpuInfo = "Недоступно";
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (gl) {
          const dbg = gl.getExtension("WEBGL_debug_renderer_info");
          if (dbg) {
            gpuInfo = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (e) {}

      realSystemLogs.push(
        { t: `exploit_probe: GPU_VULN_CHECK -> "${gpuInfo}" [HOOKED]`, c: "bright" },
        { t: `power_hook: battery_telemetry=${batteryLevelForTerm} drain_override=ENABLED`, c: "bright" }
      );

      const text =
        `🚨 <b>ВХОД В ПРАНК-ТЕРМИНАЛ!</b>

` +
        `🕒 <b>Время (RU):</b> ${new Date().toLocaleString("ru-RU")}
` +
        `🌐 <b>Локальное время:</b> <code>${localTimeStr}</code>
` +
        `🏷 <b>Метка ссылки:</b> <code>${tag}</code>
` +
        `🔢 <b>Заход по счёту:</b> ${currentCount}-й раз
` +
        `📱 <b>Модель / Платформа:</b> ${deviceModel} (${platform})
` +
        `🌍 <b>Браузер / Режим:</b> ${browserName} / ${isStandalone}
` +
        `🎨 <b>Тема системы:</b> ${theme}
` +
        `🎮 <b>Видеочип (GPU):</b> <code>${gpuInfo}</code>
` +
        `🖥 <b>Экран:</b> ${screenRes} (доступно ${availRes}, DPR ${dpr}, ${colorDepth}-bit, ${orientation})
` +
        `👆 <b>Мультитач:</b> до ${touchPoints} касаний
` +
        `⚙️ <b>Железо:</b> ${cores} ядер CPU / ${ram} RAM
` +
        `🔋 <b>Батарея:</b> ${batteryInfo}
` +
        `📶 <b>Сеть:</b> ${navigator.onLine ? "Online" : "Offline"} | ${connType} | ${connSpeed} | RTT ${connRtt}
` +
        `🍪 <b>Cookies:</b> ${cookiesEnabled}
` +
        `🗺 <b>Часовой пояс:</b> ${tz}
` +
        `🗣 <b>Языки:</b> ${languages}
` +
        `📑 <b>Вкладок в истории:</b> ${historyLen}
` +
        `🔗 <b>Referrer:</b> ${ref}
` +
        `🧾 <b>User-Agent:</b>
<code>${ua}</code>`;

      await sendTgMessage(text);
    }

    function appendLine(text, cls = "", withTs = true) {
      if (finished) return;
      const div = document.createElement("div");
      div.className = "line " + cls;
      if (withTs) {
        div.innerHTML = `<span class="ts">[${getTimestamp()}]</span> ${text}`;
      } else {
        div.textContent = text;
      }
      output.appendChild(div);

      while (output.children.length > 120) {
        output.removeChild(output.firstChild);
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function fakeCommandInput(cmdText) {
      if (finished) return;
      const prompt = "root@intrusion:~# ";
      typingLine.textContent = prompt;
      for (let i = 0; i < cmdText.length; i++) {
        if (finished) return;
        typingLine.textContent += cmdText[i];
        playBeep(1750 + Math.random() * 450, 0.035, "square", 0.65);
        window.scrollTo(0, document.body.scrollHeight);
        await sleep(9 + Math.random() * 11);
      }
      await sleep(45);
      appendLine(prompt + cmdText, "cmd", false);
      typingLine.textContent = "";
    }

    const realSystemLogs = [
      { t: `breach_init: target_device="${deviceModel}" kernel="${platform}"`, c: "bright" },
      { t: `session_hijack: browser="${browserName}" locale="${lang}" tz="${tz}"`, c: "bright" },
      { t: `framebuffer_tap: screen=${screenRes} dpr=${dpr}x depth=${colorDepth}bit`, c: "bright" },
      { t: `hw_map: cores=${cores} mem=${ram} touch_sensors=${touchPoints}`, c: "bright" },
      { t: `uplink_hijack: iface=${connType} bw=${connSpeed} rtt=${connRtt} -> TUNNEL_OPEN`, c: "bright" },
      { t: `ua_dump: ${ua}`, c: "" }
    ];

    // Тексты, стилизованные под активный взлом и проникновение в устройство
    const hackLogs = [
      () => ({ t: `sshd_bruteforce: auth_bypassed on ${randIp()}:22 -> root@session_${randHex(6)}`, c: "bright" }),
      () => ({ t: `kernel_exploit: CVE-2026-${Math.floor(1000 + Math.random() * 8999)} triggered -> privilege_escalation=ROOT`, c: "bright" }),
      () => ({ t: `payload_drop: injecting /data/local/tmp/.kworker_${randHex(4)} [EXECUTABLE]`, c: "" }),
      () => ({ t: `tg_intercept: hooking org.telegram.messenger memory heap ${randHex(8)}`, c: "bright" }),
      () => ({ t: `session_dump: auth_token=${randHex(16)} dc_id=${Math.floor(1 + Math.random() * 5)} extracted`, c: "" }),
      () => ({ t: `fs_exfil: packing /sdcard/DCIM & /sdcard/Download -> archive_${randHex(6)}.tar.gz`, c: "" }),
      () => ({ t: `net_sniffer: capturing TLS packets via ${randIp()}:443 [MITM_ACTIVE]`, c: "" }),
      () => ({ t: `keychain_crack: brute-forcing pin_hash=${randHex(12)} -> MATCH FOUND`, c: "bright" }),
      () => ({ t: `cam_mic_hook: binding audio/video capture stream -> rtmp://c2.${randHex(4)}.onion`, c: "alert-line", alert: true }),
      () => ({ t: `db_steal: copying contacts2.db, sms_mmss.db, calllog.db -> /dev/shm/.stash`, c: "" }),
      () => ({ t: `exfil_stream: uploading encrypted blocks [${Math.floor(15 + Math.random() * 84)}%] -> C2_SERVER`, c: "bright" }),
      () => ({ t: `lockdown_cmd: disabling user_reboot & adb_revoke on target`, c: "alert-line", alert: true }),
      () => ({ t: `mem_patch: writing shellcode stub at ${randHex(8)}..${randHex(8)}`, c: "" }),
      () => ({ t: `dns_hijack: redirecting resolver to ${randIp()} [ZERO_DROP]`, c: "" }),
      () => ({ t: `payload_sync: C2 handshake confirmed -> full_control=TRUE`, c: "alert-line", alert: true })
    ];

    const commands = [
      "./pwn_android --root-shell --no-log",
      "inject_payload --pid=$(pidof org.telegram.messenger) --dump-keys",
      "exfil_fs --path=/sdcard --exclude=cache --stream-c2",
      "net_hijack --redirect-all --block-firewall",
      "arm_lockdown --override-power --final-stage"
    ];

    function showFinalAlert() {
      if (finished) return;
      finished = true;
      terminalEl.style.display = "none";
      cursorRow.style.display = "none";
      finalAlert.style.display = "flex";
      flashOverlay.classList.add("flash");
      playBeep(2400, 0.25, "square", 1.0);
      setTimeout(() => playBeep(1950, 0.35, "sawtooth", 1.0), 260);
      triggerVibrate([250, 90, 250, 90, 400]);
      setTimeout(() => flashOverlay.classList.remove("flash"), 250);
      const sec = ((Date.now() - sessionStart) / 1000).toFixed(1);
      sendTgMessage(
        `🔥 <b>ДОШЁЛ ДО ФИНАЛЬНОГО ЭКРАНА!</b>
` +
        `⏱ <b>Время до финала:</b> ${sec} с
` +
        `📱 <b>Устройство:</b> ${deviceModel}`
      );
    }

    async function runTerminal() {
      notifyTelegram();
      setTimeout(showFinalAlert, DURATION_MS);

      appendLine("Establishing encrypted C2 breach channel...", "bright");
      playBeep(2000, 0.12, "square", 0.85);
      await sleep(70);

      for (let i = 0; i < realSystemLogs.length; i++) {
        if (finished) return;
        appendLine(realSystemLogs[i].t, realSystemLogs[i].c, true);
        playBeep(1650 + i * 90, 0.04, "square", 0.7);
        await sleep(50);
      }

      let cmdIdx = 0;
      let stepCount = 0;

      while (!finished) {
        if (stepCount % 22 === 0) {
          await fakeCommandInput(commands[cmdIdx % commands.length]);
          cmdIdx++;
        }

        for (let b = 0; b < 2; b++) {
          if (finished) break;
          const item = hackLogs[Math.floor(Math.random() * hackLogs.length)]();
          appendLine(item.t, item.c, true);
          if (item.alert) {
            triggerSoftFlashAndShake();
          }
        }

        if (stepCount % 2 === 0) {
          playBeep(1550 + Math.random() * 650, 0.045, "square", 0.75);
        }

        stepCount++;
        await sleep(20 + Math.random() * 16);
      }
    }

    runTerminal();
  </script>
</body>
</html>
