<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>System Breach // Console</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #020402;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.35;
      min-height: 100vh;
      overflow-x: hidden;
      text-shadow: 0 0 5px rgba(0, 255, 65, 0.35);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.22),
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 25;
    }

    /* Очень мягкая красная подсветка по краям */
    #flash-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      box-shadow: inset 0 0 0 rgba(220, 75, 88, 0);
      transition: box-shadow 0.16s ease, background-color 0.16s ease;
    }

    #flash-overlay.flash {
      box-shadow: inset 0 0 18px rgba(220, 75, 88, 0.16);
      background-color: rgba(220, 75, 88, 0.01);
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      50% { transform: translate(2px, -1px); }
      75% { transform: translate(-2px, -1px); }
    }

    .shake {
      animation: shake 0.2s linear;
    }

    /* Первое окно: Загрузка... и зелёное поле запуска под ним */
    #loader-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 22px;
    }

    .loading-title {
      font-size: 26px;
      font-weight: bold;
      color: #00ff41;
      letter-spacing: 1px;
    }

    .launch-box {
      width: 100%;
      max-width: 300px;
      padding: 15px 22px;
      border: 2px solid #00ff41;
      background: rgba(0, 255, 65, 0.16);
      color: #66ff8c;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 255, 65, 0.24);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .launch-box:active {
      transform: scale(0.97);
      background: rgba(0, 255, 65, 0.28);
    }

    .loader-sub {
      font-size: 12px;
      color: #00b830;
    }

    /* Экран терминала */
    #terminal {
      display: none;
      max-width: 860px;
      margin: 0 auto;
      padding: 12px 12px 50px;
    }

    #top-bar {
      position: sticky;
      top: 0;
      background: rgba(2, 4, 2, 0.94);
      border-bottom: 1px solid #0d3b17;
      padding: 6px 4px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #00cc33;
      z-index: 12;
    }

    .line {
      margin-bottom: 2px;
      word-break: break-all;
      color: #00ff41;
    }

    .ts {
      color: #008f24;
    }

    .bright {
      color: #66ff8c;
      font-weight: bold;
    }

    .cmd {
      color: #99ffb3;
      font-weight: bold;
    }

    .soft-alert {
      color: #d47179;
      font-weight: bold;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #00ff41;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Финальный экран */
    #final-alert {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 18px;
      gap: 14px;
    }

    #final-alert .alert-text {
      color: #d96670;
      font-size: 25px;
      font-weight: bold;
      line-height: 1.35;
      text-shadow: 0 0 6px rgba(217, 102, 112, 0.22);
      animation: pulseSoftRed 1.4s infinite alternate;
    }

    #final-alert .sub-warn {
      color: #cc5c66;
      font-size: 12px;
      line-height: 1.4;
      max-width: 360px;
      opacity: 0.9;
    }

    .meme-box {
      margin-top: 8px;
      width: 190px;
      height: 190px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
    }

    .meme-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes pulseSoftRed {
      from { opacity: 0.85; }
      to { opacity: 1; }
    }
  </style>
</head>

      const m = ua.match(/Android\s[\d.]+;\s([^;)]+)/i);
      if (m && m[1]) return m[1].trim();
      if (/iPhone/i.test(ua)) return "Apple iPhone";
      if (/Windows/i.test(ua)) return "Windows PC";
      return platform;
    }

    function detectBrowser() {
      if (/Edg\//i.test(ua)) return "Edge";

    const deviceModel = detectDeviceModel();

    // Чистый короткий писк (2400-2900 Hz, sine)
    function ensureAudioContext() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") {

            if (audioState) audioState.textContent = "BEEP: ON";
          }).catch(() => {});
        } else if (audioCtx && audioCtx.state === "running") {
          if (audioState) audioState.textContent = "BEEP: ON";
        }
      } catch (e) {}
    }

        gain.gain.exponentialRampToValueAtTime(0.0001, now + ms / 1000);
